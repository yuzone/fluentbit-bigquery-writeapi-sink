[SERVICE]
    Daemon          off
    Log_Level       info
    Flush           1
    Grace           5
    plugins_file    /fluent-bit/etc/plugins.conf
    # Fast retries so the transient-failure scenario completes quickly.
    scheduler.base  1
    scheduler.cap   3

# POST http://localhost:9880/<tag> ingests a JSON record (or array) with that tag.
#
# Enable_Multiplexing is on for every output on purpose: the managed writer then sends
# write_stream with every AppendRows request. bigquery-emulator <= 0.8.1 picks a random
# stream when write_stream is omitted (fixed upstream in goccy/bigquery-emulator#491, not
# released yet), which misroutes rows between tables. The emulator also decodes every row
# with the first schema seen on a connection, so all e2e tables share one schema.
[INPUT]
    Name            http
    Listen          0.0.0.0
    Port            9880

# Scenario: static table.
[OUTPUT]
    Name            writeapi
    Match           static.*
    ProjectId       e2e
    DatasetId       logs
    TableId         static_logs
    Endpoint            bq-proxy:9060
    Insecure            true
    Enable_Multiplexing true
    Retry_Limit         20

# Scenario: $TAG[n] routing to several tables + unknown table handling (drop).
[OUTPUT]
    Name                 writeapi
    Match                app.*
    ProjectId            e2e
    DatasetId            logs
    TableId              $TAG[1]
    Unknown_Table_Action drop
    Endpoint             bq-proxy:9060
    Insecure             true
    Enable_Multiplexing  true
    Retry_Limit          20

# Scenario: table that does not exist yet -> FLB_RETRY -> redelivery once it is created.
[OUTPUT]
    Name                 writeapi
    Match                late.*
    ProjectId            e2e
    DatasetId            logs
    TableId              $TAG[1]
    Unknown_Table_Action retry
    Endpoint             bq-proxy:9060
    Insecure             true
    Enable_Multiplexing  true
    Retry_Limit          no_limits

# Scenario: backend outage -> AppendRows blocks -> FLB_RETRY after Flush_Timeout_Sec -> redelivery.
[OUTPUT]
    Name                writeapi
    Match               outage.*
    ProjectId           e2e
    DatasetId           logs
    TableId             outage_logs
    Flush_Timeout_Sec   2
    Endpoint            bq-proxy:9060
    Insecure            true
    Enable_Multiplexing true
    Retry_Limit         no_limits
